# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
    colors = true
    interval = 5
    color_good = "#008000"
    color_degraded = "#AAAA00"
    color_bad = "#AA0000"
}

order += "ipv6"
order += "disk /"
order += "disk /mnt/transfer"
{% for device in i3status.ethernet_devices %}
order += "ethernet {{ device.name }}"
{% endfor %}
order += "load"
order += "memory"


{% for device in i3status.ethernet_devices %}
ethernet {{ device.name }} {
        format_up = "{{ device.label }}: %ip (%speed)"
        format_down = "{{ device.label }}: down"
}
{% endfor %}

load {
        format = "%1min"
}

memory {
    threshold_degraded = "10%"
    threshold_critical = "5%"
    format = "%free"
    format_degraded = "LOW: %free"
}

disk "/" {
        format = "%avail"
}

disk "/mnt/transfer" {
    # always alert when this is mounted
    format = "TRANSFER DIR MOUNTED"
    low_threshold = 100
    threshold_type = percentage_free
}